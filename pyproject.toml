[project]
name = "bookmarks-page"
version = "0.1.0"
description = "Build a static start page from a Chrome bookmarks export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bookmarks-page = "bookmarks_page.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ANN", "D", "PTH"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
